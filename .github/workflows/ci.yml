name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # txbuilder depends on evm-ui via file:../evm-ui, so both repos are
      # checked out as siblings and evm-ui is built first (its dist/ is not
      # committed).
      - uses: actions/checkout@v5
        with:
          path: txbuilder
      - uses: actions/checkout@v5
        with:
          repository: gearcat0/evm-ui
          path: evm-ui

      # Pinned to a pnpm release that satisfies our own 7-day release-age policy.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.28.3

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: txbuilder/pnpm-lock.yaml

      # evm-ui still uses npm, and its devEngines require npm >= 11.18
      # (min-release-age and allowScripts support); Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11.19.1

      - name: Build evm-ui
        working-directory: evm-ui
        run: |
          npm ci
          npm run build

      # Dependency build scripts are all declined in pnpm-workspace.yaml
      # (allowBuilds); minimumReleaseAge is re-checked against the lockfile.
      - name: Install dependencies
        working-directory: txbuilder
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: txbuilder
        run: pnpm test

      - name: Build renderer
        working-directory: txbuilder
        run: pnpm vite:build

      - name: Check signatures.json is up to date
        working-directory: txbuilder
        run: |
          pnpm gen:signatures
          git diff --exit-code src/data/signatures.json

# Supply-chain policy: never resolve a version published less than 7 days ago
# (10080 minutes). A fix that is newer than that waits, or gets an explicit,
# reviewed entry in minimumReleaseAgeExclude.
minimumReleaseAge: 10080

overrides:
  "@noble/curves": "^1.9.7"
  "@noble/hashes": "^1.8.0"
  "protobufjs": "^7.6.5"
  "axios": "^1.19.0"
  "ws": "^8.21.0"
  "form-data": "^4.0.6"
  "lodash": "^4.18.1"
  "ip-address": "^10.5.0"
  "nanoid": "^3.3.18"
  "picomatch": "^4.0.5"
  "postcss": "^8.5.26"
  "shell-quote": "^1.11.0"
  "@electron/get>global-agent": "^4.1.3"

# No dependency needs its install script: usb ships N-API prebuilds, keccak
# falls back to its pure-JS build, esbuild's binary comes from its
# platform-specific optional dependency, and we build NSIS, not Squirrel
# (electron-winstaller). Each is listed as false so `pnpm install` (which
# electron-builder also runs before packaging) exits cleanly.
allowBuilds:
  electron-winstaller: false
  esbuild: false
  keccak: false
  usb: false
